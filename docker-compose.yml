version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: employee_mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"  # External port 27018 maps to container's 27017
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: employees_db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: employee_backend
    restart: unless-stopped
    ports:
      - "3001:1000"  # Exposes backend for browser access via server IP
    environment:
      - NODE_ENV=production
      - PORT=1000
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/employees_db?authSource=admin
      - FRONTEND_URL=http://frontend:3000
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://192.168.2.141:3001/api/employees  # Build-time arg for browser
    container_name: employee_frontend
    restart: unless-stopped
    ports:
      - "3002:3000"  # External port for browser access
    environment:
      # This is for client-side fetches (browser)
      - NEXT_PUBLIC_API_URL=http://192.168.2.141:3001/api/employees
    depends_on:
      - backend

volumes:
  mongodb_data: